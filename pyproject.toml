[project]
name = "pydective"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markitdown[pdf]>=0.1.8",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "openpyxl>=3.1.5",
    "orjson>=3.12.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "rapidocr-onnxruntime>=1.4.4",
    "onnxruntime-directml>=1.24.4",
    "redis>=8.1.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.44.0,<4.45.0",
    "timm>=1.0.30",
    "einops>=0.8.2",
    "uvicorn[standard]>=0.53.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
